name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 isort mypy
          pip install black==24.4.0
          pip install -r requirements.txt

      - name: markdownlint-cli2-action
        uses: DavidAnson/markdownlint-cli2-action@main

      #- name: Check formatting with Black
      #  run: black . --check --diff

      - name: Sort imports with isort
        run: isort . --check-only --profile black

      - name: Lint with flake8
        run: |
          # 1. Added --max-line-length=88 so syntax/undefined checks also respect 88 characters
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=88

          # 2. Changed --extend-ignore to explicitly ignore E501 (Line too long) entirely!
          flake8 . --count --max-complexity=10 --max-line-length=88 --extend-ignore=E203,W503,E501 --statistics

      - name: Static type check with mypy
        run: mypy . --ignore-missing-imports

      - name: Run All Tests
        run: |
          # Runs both test_analyzer.py and test_app.py
          python -m pytest tests/
        env:
          # Required because analyzer.py checks for this on import
          GROQ_API_KEY: "dummy_key_for_testing"
